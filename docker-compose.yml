version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: comissoes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comissoes}
      POSTGRES_USER: ${POSTGRES_USER:-comissoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comissoes123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comissoes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comissoes-net

  backend:
    build: ./backend
    container_name: comissoes-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-comissoes}:${POSTGRES_PASSWORD:-comissoes123}@postgres:5432/${POSTGRES_DB:-comissoes}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-2026}
      PORT: 3001
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - comissoes-net

  frontend:
    build: ./frontend
    container_name: comissoes-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comissoes.rule=Host(`comissoes.cloudconnectivity.com.br`)"
      - "traefik.http.routers.comissoes.entrypoints=websecure"
      - "traefik.http.routers.comissoes.tls.certresolver=letsencrypt"
      - "traefik.http.services.comissoes.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - comissoes-net

volumes:
  postgres_data:
  uploads_data:

networks:
  proxy:
    external: true
  comissoes-net:
    driver: bridge
